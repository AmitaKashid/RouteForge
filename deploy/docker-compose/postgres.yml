version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: routeforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ROUTEFORGE_POSTGRES_DB:-routeforge_dev}
      POSTGRES_USER: ${ROUTEFORGE_POSTGRES_USER:-routeforge}
      POSTGRES_PASSWORD: ${ROUTEFORGE_POSTGRES_PASSWORD:-routeforge_pass}
    ports:
      - "${ROUTEFORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
