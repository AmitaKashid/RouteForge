services:
  postgres:
    image: postgres:16
    container_name: routeforge-postgres
    environment:
      POSTGRES_DB: routeforge_dev
      POSTGRES_USER: routeforge
      POSTGRES_PASSWORD: routeforge_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeforge -d routeforge_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: routeforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
